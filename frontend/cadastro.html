DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Criar conta no Lory's Care." />
    <title>Cadastro | Lory's Care</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <a class="brand" href="login.html"><span class="brand__icon"></span>Lory's<span> Care</span></a>
        <p class="sidebar__tagline">Cuidado que acolhe. Rotina que faz bem.</p>
        <h1>Criar conta</h1>
        <p class="auth-subtitle">Cadastre-se para começar a organizar o cuidado.</p>

        <form id="signup-form">
          <div class="form-field">
            <label for="name">Nome</label>
            <input id="name" name="name" maxlength="120" required autocomplete="name" />
          </div>
          <div class="form-field" style="margin-top: 16px">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" required autocomplete="email" />
          </div>
          <div class="form-field" style="margin-top: 16px">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" minlength="8" required autocomplete="new-password" />
            <small>Ao menos 8 caracteres.</small>
          </div>
          <div class="form-field" style="margin-top: 16px">
            <label for="confirm-password">Confirmar senha</label>
            <input id="confirm-password" name="confirmPassword" type="password" minlength="8" required autocomplete="new-password" />
          </div>
          <div class="form-actions" style="margin-top: 24px">
            <button class="primary-button" id="submit-button" type="submit">Criar conta</button>
            <p class="form-message" id="form-message" aria-live="polite"></p>
          </div>
        </form>

        <p class="auth-footer">Já tem conta? <a href="login.html">Entrar</a></p>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/ui-icons.js"></script>
    <script src="js/auth-repository.js"></script>
    <script src="js/cadastro.js"></script>
  </body>
</html>
