<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Entrar no Lory's Care." />
    <title>Entrar | Lory's Care</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <a class="brand" href="login.html"><span class="brand__icon"></span>Lory's<span> Care</span></a>
        <p class="sidebar__tagline">Cuidado que acolhe. Rotina que faz bem.</p>
        <h1>Entrar</h1>
        <p class="auth-subtitle">Acesse sua conta de cuidador.</p>

        <form id="login-form">
          <div class="form-field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" required autocomplete="email" />
          </div>
          <div class="form-field" style="margin-top: 16px">
            <label for="password">Senha</label>
            <div class="password-field">
              <input id="password" name="password" type="password" required autocomplete="current-password" />
              <button class="password-toggle" id="password-toggle" type="button" aria-label="Mostrar senha" title="Mostrar senha">
                <span class="icon" data-icon="eye"></span>
              </button>
            </div>
          </div>
          <div class="form-actions" style="margin-top: 24px">
            <button class="primary-button" id="submit-button" type="submit">Entrar</button>
            <p class="form-message" id="form-message" aria-live="polite"></p>
          </div>
        </form>

        <p class="auth-footer">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
      </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/icons.js"></script>
    <script src="js/ui-icons.js"></script>
    <script src="js/password-toggle.js"></script>
    <script src="js/auth-repository.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
